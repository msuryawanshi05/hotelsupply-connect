# HotelSupply Connect — CI/CD Pipeline
# Deliverable 2: CI/CD pipeline: test → build → scan → push → deploy
# Deliverable 3: Manifests applied via kubectl in deploy step
# Deliverable 4: Images pushed to GHCR

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ─── Job 1: Run Tests ────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install API dependencies
        run: |
          cd api
          python -m pip install --upgrade pip setuptools wheel
          pip install fastapi uvicorn sqlmodel httpx prometheus-fastapi-instrumentator python-jose passlib bcrypt python-multipart pytest pytest-asyncio

      - name: Run API tests
        run: |
          cd api
          python -m pytest tests/ -v --tb=short
        env:
          DATABASE_URL: "sqlite:///:memory:"
          MATCHER_URL: "http://localhost:8001"
          NOTIFIER_URL: "http://localhost:8002"
          SECRET_KEY: "test-secret-key-ci"


  # ─── Job 2: Security Scan with Trivy ─────────────────────────────────
  scan:
    name: Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'


  # ─── Job 3: Build & Push to GHCR ─────────────────────────────────────
  push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    needs: scan
    continue-on-error: true
    strategy:
      matrix:
        service:
          - name: api
            context: api
            image: ghcr.io/msuryawanshi05/hotelsupply-api
          - name: matcher
            context: functions/matcher
            image: ghcr.io/msuryawanshi05/hotelsupply-matcher
          - name: notifier
            context: functions/notifier
            image: ghcr.io/msuryawanshi05/hotelsupply-notifier

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.service.image }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and Push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        continue-on-error: true
        with:
          context: ${{ matrix.service.context }}
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Job 4: Deploy to OpenShift/Kubernetes ───────────────────────────
  deploy:
    name: Deploy to Cluster
    runs-on: ubuntu-latest
    needs: push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
    steps:
      - name: Check KUBE_CONFIG availability
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "NOTE: KUBE_CONFIG secret is not configured in GitHub Secrets. Skipping direct kubectl deployment."
          fi

      - uses: actions/checkout@v4
        if: env.KUBE_CONFIG != ''

      - name: Set up kubectl
        if: env.KUBE_CONFIG != ''
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        if: env.KUBE_CONFIG != ''
        run: |
          mkdir -p $HOME/.kube
          echo "$KUBE_CONFIG" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Update image tags in manifests
        if: env.KUBE_CONFIG != ''
        run: |
          SHA_TAG=${{ github.sha }}
          sed -i "s|:latest|:${SHA_TAG}|g" k8s/api-deployment.yaml
          sed -i "s|:latest|:${SHA_TAG}|g" k8s/functions.yaml

      - name: Apply namespace and secrets (idempotent)
        if: env.KUBE_CONFIG != ''
        run: |
          kubectl apply -f k8s/postgres.yaml
          echo "NOTE: Apply sealed-secret.yaml separately via Sealed Secrets workflow"

      - name: Apply K8s manifests
        if: env.KUBE_CONFIG != ''
        run: |
          kubectl apply -f k8s/rbac.yaml
          kubectl apply -f k8s/networkpolicy.yaml
          kubectl apply -f k8s/api-service.yaml
          kubectl apply -f k8s/functions.yaml
          kubectl apply -f k8s/api-deployment.yaml
          kubectl apply -f k8s/api-hpa.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Wait for rollout
        if: env.KUBE_CONFIG != ''
        run: |
          kubectl rollout status deployment/hotelsupply-api -n hotelsupply --timeout=180s
          kubectl rollout status deployment/matcher -n hotelsupply --timeout=120s
          kubectl rollout status deployment/notifier -n hotelsupply --timeout=120s

      - name: Verify deployment health
        if: env.KUBE_CONFIG != ''
        run: |
          kubectl get pods -n hotelsupply
          kubectl get hpa -n hotelsupply

  # ─── Job 5: Trigger OpenShift Build ──────────────────────────────────
  trigger-openshift:
    name: Trigger OpenShift Build
    runs-on: ubuntu-latest
    needs: push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
    steps:
      - name: Trigger OpenShift Build via API
        run: |
          if [ -z "$OPENSHIFT_TOKEN" ]; then
            echo "NOTE: OPENSHIFT_TOKEN secret is not set in GitHub Secrets."
            echo "Please add OPENSHIFT_TOKEN in GitHub Repo Settings -> Secrets and variables -> Actions."
            exit 0
          fi
          echo "Triggering OpenShift builds for hotelsupply-api..."
          curl -k -X POST \
            -H "Authorization: Bearer $OPENSHIFT_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"kind":"BuildRequest","apiVersion":"build.openshift.io/v1","metadata":{"name":"hotelsupply-api"}}' \
            "https://api.rm1.0a51.p1.openshiftapps.com:6443/apis/build.openshift.io/v1/namespaces/mukul-s-dev/buildconfigs/hotelsupply-api/instantiate"



