# OpenShift Native Route Manifest for HotelSupply Connect
# Deliverable 9: OpenShift Route with TLS Termination
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: hotelsupply-route
  namespace: hotelsupply
  labels:
    app: hotelsupply-api
spec:
  to:
    kind: Service
    name: hotelsupply-api-service
    weight: 100
  port:
    targetPort: 8000
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
