# Deliverable 9: Secret management — Sealed Secrets / Vault pattern
#
# IMPORTANT: This file contains PLACEHOLDER values only.
# NEVER commit real secrets to version control.
#
# === Production Pattern ===
# Option A (Sealed Secrets):
#   1. Install Sealed Secrets controller: kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.27.0/controller.yaml
#   2. Install kubeseal CLI
#   3. Create this Secret locally, encrypt with kubeseal:
#      kubeseal --format yaml < secret.yaml > sealed-secret.yaml
#   4. Commit sealed-secret.yaml (safe to commit, encrypted with cluster key)
#   5. Delete secret.yaml immediately
#
# Option B (HashiCorp Vault + Vault Agent Injector):
#   1. Install Vault on cluster or use HCP Vault
#   2. Store secrets in Vault at path secret/hotelsupply
#   3. Use Vault Agent Injector annotations on pod to inject secrets at runtime
#   4. No secrets ever touch etcd in plaintext
#
# === Local Dev ===
# Copy this file, fill in real values, apply with kubectl:
#   cp secret-example.yaml secret.yaml
#   # Edit secret.yaml with real base64-encoded values
#   kubectl apply -f secret.yaml
#   rm secret.yaml  # never commit!

apiVersion: v1
kind: Secret
metadata:
  name: hotelsupply-secrets
  namespace: hotelsupply
type: Opaque
stringData:
  postgres-password: CHANGE_ME_USE_SEALED_SECRETS
  database-url: postgresql://hotelsupply:CHANGE_ME@postgres:5432/hotelsupplydb
  secret-key: CHANGE_ME_GENERATE_WITH_openssl_rand_hex_32
  jwt-secret: CHANGE_ME_GENERATE_WITH_openssl_rand_hex_32
---
# For production, use cert-manager with Let's Encrypt ClusterIssuer
apiVersion: v1
kind: Secret
metadata:
  name: hotelsupply-tls-secret
  namespace: hotelsupply
type: kubernetes.io/tls
data:
  tls.crt: BASE64_ENCODED_CERTIFICATE_HERE
  tls.key: BASE64_ENCODED_PRIVATE_KEY_HERE
