# Deliverable 9: Least-privilege RBAC. Three roles: hotel, supplier, admin.
# Note: Application-level RBAC (hotel/supplier roles) is enforced via JWT middleware in the API. K8s RBAC here controls Kubernetes API access per service account.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-sa
  namespace: hotelsupply
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hotel-sa
  namespace: hotelsupply
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: supplier-sa
  namespace: hotelsupply
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-sa
  namespace: hotelsupply
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: api-role
  namespace: hotelsupply
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hotel-role
  namespace: hotelsupply
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: supplier-role
  namespace: hotelsupply
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: admin-role
  namespace: hotelsupply
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-rolebinding
  namespace: hotelsupply
subjects:
  - kind: ServiceAccount
    name: api-sa
    namespace: hotelsupply
roleRef:
  kind: Role
  name: api-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hotel-rolebinding
  namespace: hotelsupply
subjects:
  - kind: ServiceAccount
    name: hotel-sa
    namespace: hotelsupply
roleRef:
  kind: Role
  name: hotel-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: supplier-rolebinding
  namespace: hotelsupply
subjects:
  - kind: ServiceAccount
    name: supplier-sa
    namespace: hotelsupply
roleRef:
  kind: Role
  name: supplier-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: admin-rolebinding
  namespace: hotelsupply
subjects:
  - kind: ServiceAccount
    name: admin-sa
    namespace: hotelsupply
roleRef:
  kind: Role
  name: admin-role
  apiGroup: rbac.authorization.k8s.io
